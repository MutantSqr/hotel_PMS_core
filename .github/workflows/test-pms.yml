name: PMS Tests

on:
  push:
    branches:
      - work/pms-business-rules
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run PMS tests
        run: python -m pytest -q
